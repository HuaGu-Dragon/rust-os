[package]
name = "rust-os"
version = "0.1.0"
edition = "2024"

[[test]]
name = "should_panic"
harness = false

[profile.dev]

[profile.release]
panic = "abort"

[[bin]]
name = "rust-os"
test = true
bench = false

[package.metadata.bootimage]
test-args = ["-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio", "-display", "none"]
test-timeout = 300
test-success-exit-code = 33

[dependencies]
bootloader = "=0.9.32"
uart_16550 = "0.5.0"
x86_64 = "0.15.4"
